<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxiland Event</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F3EC;
    --surface: #FFFFFF;
    --surface-sunken: #FCFAF6;
    --brand: #4A3B31;
    --ink: #241C16;
    --ink-on: #F7F3EC;
    --text-secondary: #6B5F52;
    --text-tertiary: #5E5449;
    --rule: #E4DACB;
    --rule-inner: #EFE7DA;
    --brass: #8A6A2F;
    --live: #3F6B4F;
    --live-chip-bg: #EDF2EE;
    --live-chip-text: #31563E;
    --error: #cc3333;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  .header {
    background: var(--brand);
    color: var(--ink-on);
    padding: 28px 20px 24px;
  }
  .wordmark {
    font-family: "Yeseva One", serif;
    font-size: 22px;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--live-chip-bg);
    color: var(--live-chip-text);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .live-dot { width: 7px; height: 7px; border-radius: 4px; background: var(--live); }
  .ended-pill { background: var(--rule-inner); color: var(--text-secondary); }
  h1 {
    font-family: "Yeseva One", serif;
    font-size: 30px;
    line-height: 1.15;
    margin: 0 0 6px;
  }
  .organizer { color: var(--text-tertiary); font-size: 14px; margin: 0 0 20px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card p { margin: 0; font-size: 14.5px; line-height: 1.55; }
  .detail-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--brass);
    margin: 0 0 6px;
  }
  .detail-value { font-size: 14.5px; line-height: 1.5; margin: 0 0 14px; }
  .detail-value:last-child { margin-bottom: 0; }
  .cta {
    display: block;
    text-align: center;
    background: var(--ink);
    color: var(--ink-on);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 15px;
    border-radius: 12px;
    margin: 20px 0 8px;
  }
  .fallback {
    background: var(--surface-sunken);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 14px;
    margin-top: 18px;
  }
  .fallback p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--text-secondary); }
  .fallback p + p { margin-top: 8px; }
  .about {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--rule-inner);
  }
  .about h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-tertiary); margin: 0 0 8px; }
  .about p { font-size: 13.5px; line-height: 1.6; color: var(--text-secondary); margin: 0; }
  .state-message { text-align: center; padding: 60px 20px; }
  .state-message h1 { font-size: 22px; }
  .state-message p { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1A130F;
      --surface: #241C16;
      --surface-sunken: #201812;
      --ink: #F7F3EC;
      --ink-on: #241C16;
      --text-secondary: #C9BEB0;
      --text-tertiary: #B3A896;
      --rule: #3A2F26;
      --rule-inner: #332A22;
    }
    .cta { background: var(--brass); color: #241C16; }
  }
</style>
</head>
<body>
  <div class="header"><span class="wordmark">Proxiland</span></div>
  <div class="container" id="app">
    <div class="state-message"><p>Loading event…</p></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dhfqmhmaefeqeqzkwpsf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoZnFtaG1hZWZlcWVxemt3cHNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNjUzMzksImV4cCI6MjA5OTk0MTMzOX0.tCKJFUg_BS2omGMlrBogVb6h0zdIIYh8e4oncLNV9dc';

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatWhen(startsAt, endsAt, timezone) {
      if (!startsAt) return null;
      const opts = { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' };
      if (timezone) opts.timeZone = timezone;
      const start = new Date(startsAt);
      let label = start.toLocaleString(undefined, opts);
      if (endsAt) {
        const end = new Date(endsAt);
        const endOpts = { hour: 'numeric', minute: '2-digit' };
        if (timezone) endOpts.timeZone = timezone;
        label += ' – ' + end.toLocaleString(undefined, endOpts);
      }
      if (timezone) label += ' (' + timezone.split('/').pop().replace('_', ' ') + ')';
      return label;
    }

    function render(html) {
      document.getElementById('app').innerHTML = html;
    }

    function renderMessage(title, body) {
      render(
        '<div class="state-message"><h1>' + escapeHtml(title) + '</h1><p>' + escapeHtml(body) + '</p></div>'
      );
    }

    async function main() {
      const token = qs('t');
      if (!token) {
        renderMessage("This link isn't valid", 'Ask the organiser for the invitation link again.');
        return;
      }

      let event;
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_event_landing_info', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            apikey: SUPABASE_ANON_KEY,
            Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({ p_token: token }),
        });
        if (!res.ok) throw new Error('lookup failed');
        const rows = await res.json();
        event = rows && rows.length > 0 ? rows[0] : null;
      } catch (e) {
        renderMessage("Couldn't load this event", 'Check your connection and try again.');
        return;
      }

      if (!event) {
        renderMessage("This event link isn't valid", 'It may have expired, or the event may not be public yet. Check with the organiser.');
        return;
      }

      const deepLink = 'proxiland://event-join/' + encodeURIComponent(token);
      const isEnded = event.status === 'ended';
      const when = formatWhen(event.starts_at, event.ends_at, event.timezone);

      let html = '';
      html += isEnded
        ? '<div class="live-pill ended-pill">This event has ended</div>'
        : '<div class="live-pill"><span class="live-dot"></span>Live invitation</div>';
      html += '<h1>' + escapeHtml(event.name || 'Event') + '</h1>';
      if (event.organizer_name) html += '<p class="organizer">Hosted by ' + escapeHtml(event.organizer_name) + '</p>';

      if (event.description) {
        html += '<div class="card"><p>' + escapeHtml(event.description) + '</p></div>';
      }

      const details = [];
      if (when) details.push(['When', when]);
      if (event.venue_name || event.venue_address) {
        details.push(['Where', [event.venue_name, event.venue_address].filter(Boolean).join(' — ')]);
      }
      if (details.length > 0) {
        html += '<div class="card">';
        details.forEach(([label, value], i) => {
          html += '<p class="detail-label">' + escapeHtml(label) + '</p>';
          html += '<p class="detail-value">' + escapeHtml(value) + '</p>';
        });
        html += '</div>';
      }

      if (!isEnded) {
        html += '<a class="cta" href="' + deepLink + '">Open in Proxiland</a>';
        html += '<div class="fallback">';
        html += '<p><strong>Don’t have the app yet?</strong></p>';
        html += '<p>Proxiland is currently invite-only via TestFlight. Ask the organiser to add you, install the app from the TestFlight invite they send, then come back to this link or use the event code they give you.</p>';
        html += '</div>';
      }

      html += '<div class="about">';
      html += '<h2>What is Proxiland</h2>';
      html += '<p>Proxiland helps you meet the right people at an event in person — tell it what you’re looking for and what you can offer, and it matches you with other attendees who are actually there with you.</p>';
      html += '</div>';

      render(html);
    }

    main();
  </script>
</body>
</html>
