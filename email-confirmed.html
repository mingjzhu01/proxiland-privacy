<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Email confirmed — Proxiland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #544236;
    --cream: #F8F4ED;
    --ink: #6E5C4C;
    --sand: #D2C8BA;
  }
  html, body { margin: 0; background: var(--cream); color: var(--dark); }
  body {
    font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    box-sizing: border-box;
    text-align: center;
  }
  .card { max-width: 360px; width: 100%; }
  .wordmark {
    font-family: "Yeseva One", Georgia, serif;
    font-weight: 400;
    font-size: 30px;
    letter-spacing: 0.005em;
    margin: 0 0 28px;
  }
  h1 {
    font-family: "Source Sans 3", sans-serif;
    font-weight: 600;
    font-size: 21px;
    line-height: 1.3;
    margin: 0 0 10px;
  }
  p { color: var(--ink); font-size: 16px; line-height: 1.5; margin: 0 0 24px; }
  .button {
    display: inline-block;
    background: var(--dark);
    color: var(--cream);
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    padding: 14px 28px;
    border-radius: 14px;
  }
  .hint { font-size: 13.5px; margin-top: 18px; margin-bottom: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="wordmark">Proxiland</div>
  <h1 id="title">Email confirmed</h1>
  <p id="body">Your account is ready. Open Proxiland and sign in with the email and password you chose.</p>
  <a class="button" id="open" href="proxiland://">Open Proxiland</a>
  <p class="hint" id="hint">If you're on a computer, just open the app on your phone.</p>
</div>
<script>
  // Supabase appends its result to the URL fragment. On success there's nothing to act on; on
  // failure it's #error=...&error_code=otp_expired&error_description=... — most often because
  // a mail client's link scanner opened the one-time link first, or it was opened twice.
  var params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  if (params.get('error')) {
    var code = params.get('error_code') || '';
    document.getElementById('title').textContent =
      code === 'otp_expired' ? 'This link has expired' : "This link didn't work";
    document.getElementById('body').textContent =
      'Open Proxiland and sign in — if it says your email isn’t confirmed yet, use “Resend confirmation” there to get a fresh link.';
    document.getElementById('hint').textContent = 'Links are single-use and expire after a while.';
  }
</script>
</body>
</html>
